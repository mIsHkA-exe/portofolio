<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Black hole" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>

    <defs>
        <!-- Dégradé du disque : plus clair au centre, violet aux extrémités -->
        <linearGradient id="disc" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%"   stop-color="#8B72E8"/>
            <stop offset="35%"  stop-color="#C9B8FF"/>
            <stop offset="65%"  stop-color="#C9B8FF"/>
            <stop offset="100%" stop-color="#8B72E8"/>
        </linearGradient>

        <!-- Halo diffus, volontairement discret pour ne pas éclaircir le centre -->
        <radialGradient id="glow" cx="50%" cy="50%" r="50%">
            <stop offset="45%"  stop-color="#B49CFF" stop-opacity="0.40"/>
            <stop offset="100%" stop-color="#B49CFF" stop-opacity="0"/>
        </radialGradient>
    </defs>

    <!-- Fond : la couleur de fond du site -->
    <rect width="64" height="64" fill="#0B0B12"/>

    <!-- Halo -->
    <circle cx="32" cy="32" r="26" fill="url(#glow)"/>

    <!-- Disque d'accrétion vu presque par la tranche.
         Dessiné en entier : sa partie supérieure passera derrière l'horizon. -->
    <ellipse cx="32" cy="32" rx="25" ry="9"
             fill="none" stroke="url(#disc)" stroke-width="5"
             stroke-linecap="round"/>

    <!-- Horizon des événements : masque le centre du disque -->
    <circle cx="32" cy="32" r="14" fill="#0B0B12"/>

    <!-- Anneau de photons : la lumière courbée autour de l'horizon -->
    <circle cx="32" cy="32" r="14"
            fill="none" stroke="#EDEDF5" stroke-width="2.4"/>

    <!-- Moitié avant du disque, redessinée par-dessus l'horizon.
         C'est ce recouvrement qui crée la profondeur. -->
    <path d="M 7 32 A 25 9 0 0 0 57 32"
          fill="none" stroke="url(#disc)" stroke-width="5"
          stroke-linecap="round"/>

</svg>
